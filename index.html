<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MCU — Cronologia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="brand">MARVEL <span>STUDIOS</span></div>
    <h1>CRONOLOGIA DO MCU</h1>
    <p>Marque o que você já assistiu e acompanhe seu progresso.</p>
  </header>

  <main>
    <section class="progress-card">
      <div class="progress-top">
        <div><strong id="progressText">0/0</strong> assistidos</div>
        <div id="percent">0%</div>
      </div>
      <div class="bar"><div id="barFill"></div></div>
      <div class="actions">
        <button id="reset">Desmarcar tudo</button>
        <button id="toggleCompleted">Ocultar concluídos</button>
      </div>
    </section>

    <section class="controls">
      <input id="search" type="search" placeholder="🔎 Procurar filme, série ou curta...">
      <div class="filters">
        <button class="filter active" data-filter="all">Todos</button>
        <button class="filter" data-filter="filme">🎬 Filmes</button>
        <button class="filter" data-filter="serie">📺 Séries</button>
        <button class="filter" data-filter="curta">🎞️ Curtas / Especiais</button>
        <button class="filter" data-filter="animacao">✨ Animações</button>
      </div>
    </section>

    <div id="list"></div>
  </main>

  <footer>Seu progresso fica salvo neste navegador automaticamente.</footer>
  <script src="script.js"></script>
</body>
</html>
